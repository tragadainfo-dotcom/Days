<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>День · Журнал поручений</title>
<style>
:root{font:15px/1.45 system-ui,"Segoe UI",sans-serif;color:#202033;background:#f7f5fa;--muted:#615e72;--border:#e7e2ee;--purple:#692dc3;--graphite:#24242b;--pink:#c11679}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #8e40dc;outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.55}
[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.shell.compact{grid-template-columns:70px minmax(0,1fr)}
.sidebar{background:linear-gradient(165deg,#2b2c32,#202027);color:#fff;padding:23px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:25px}
.brand{display:flex;align-items:center;gap:10px;padding-left:5px}
.brand b{font-size:20px;letter-spacing:-.6px}
.brand .symbol{display:block;width:44px;height:44px;flex:none;overflow:hidden;border-radius:11px;background:#36353f}
.brand .symbol img{display:block;width:100%;height:100%}
.compact .brand .symbol{width:40px;height:40px}
.sidebar nav{display:grid;gap:7px}
.sidebar button{border:0;background:transparent;color:#eeeafc;text-align:left;white-space:nowrap;border-radius:10px;display:flex;align-items:center;gap:12px;padding:11px 12px}
.sidebar nav button[aria-current="page"]{background:linear-gradient(112deg,#c9238c,#7733cf);color:#fff}
.sidebar button:hover{background-color:#3c3b47}
.sidebar .toggle{margin-top:auto}
.compact .nav-label,.compact .brand b{display:none}
.compact .brand{justify-content:center;padding-left:0}
.compact .sidebar button{justify-content:center;padding-inline:0}
.icon{width:20px;height:20px;flex:none;vertical-align:middle}
.workspace{min-width:0}
.topbar{min-height:69px;background:#fff;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px clamp(14px,3vw,36px)}
.search{display:flex;align-items:center;gap:9px;min-width:0;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#fbfaff;color:var(--muted);width:min(390px,55vw)}
.search input{border:0;background:transparent;min-width:0;width:100%}
main{max-width:1500px;margin:auto;padding:25px clamp(14px,3vw,36px) 38px}
.header,.panel-head,.actions,.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header,.panel-head{justify-content:space-between}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(28px,3.2vw,42px);line-height:1.12;letter-spacing:-.05em}
h2{font-size:19px;letter-spacing:-.025em}
h3{font-size:15px}
.header{margin-bottom:20px}
.muted,.hint,small{color:var(--muted)}
.date-label{background:#eee8f7;color:#473367;padding:7px 11px;border-radius:9px;font-size:13px}
.metrics,.charts{display:grid;gap:16px;margin-bottom:16px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
.charts{grid-template-columns:1.35fr 1fr}
.metric{text-align:left;color:white;display:grid;gap:3px;position:relative;overflow:hidden;border:0;border-radius:14px;min-height:108px;padding:16px}
.metric:after{content:"";position:absolute;right:-25px;bottom:-60px;width:155px;height:155px;border:24px solid #ffffff20;border-radius:50%;pointer-events:none}
.metric .icon{position:absolute;right:16px;top:17px;opacity:.9}
.metric strong{font-size:38px;line-height:1.1;letter-spacing:-.06em}
.violet{background:linear-gradient(120deg,#5022ab,#8f37d8)}
.blue{background:linear-gradient(120deg,#1253c3,#007c98)}
.pink{background:linear-gradient(120deg,#96258a,#c2216d)}
.orange{background:linear-gradient(120deg,#c32d49,#af4f07)}
.panel{background:#fff;border:1px solid var(--border);border-radius:15px;padding:16px;box-shadow:0 4px 17px #27144108;min-width:0}
.panel-head{margin-bottom:12px}
.button,summary.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);border-radius:9px;background:white;padding:7px 11px;text-decoration:none;white-space:nowrap}
.button:hover{border-color:#ac8ed7;background:#fbf7ff}
.primary,.primary:hover{background:linear-gradient(110deg,#b51977,#6d29ba);border-color:transparent;color:white;font-weight:650}
.button .icon{width:17px;height:17px}
.toolbar{margin-bottom:12px}
.toolbar select{max-width:220px}
.field{border:1px solid #ded6e9;border-radius:8px;background:white;padding:7px 8px;min-width:0}
.segment{display:inline-flex;padding:3px;background:#f2edf8;border-radius:9px}
.segment button{border:0;border-radius:7px;background:transparent;padding:5px 11px}
.segment button[aria-pressed="true"]{background:white;color:#5826a1;box-shadow:0 1px 4px #28124023}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
.tasks{min-width:710px}
th,td{padding:9px 8px;border-bottom:1px solid #eeeaf2;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:650}
td:first-child,th:first-child{width:32px;padding-inline:4px}
td:last-child,th:last-child{width:43px}
tr:last-child td{border-bottom:0}
.add-row td{background:#f5effe}
.add-row input{width:100%}
.add-row td:nth-child(2){width:36%}
.add-row td:nth-child(3){min-width:137px}
.add-row td:nth-child(4){min-width:156px}
.task-title{padding:0;border:0;background:transparent;text-align:left;font-weight:660}
.task-title:hover{text-decoration:underline;color:#5923a8}
.badge{display:inline-block;border:0;border-radius:16px;padding:4px 9px;font-size:12px;white-space:nowrap}
.new{background:#efebf8;color:#553f76}.doing{background:#e3efff;color:#214d93}.waiting{background:#ffeedb;color:#834b08}.done{background:#e4f3e9;color:#245f38}
.late{color:#a31642;font-weight:700}
.hint{font-size:12px;margin-top:9px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;max-height:186px;overflow:visible}
.chart-wrap text{font:11px system-ui,sans-serif;fill:#625b72}
.status-chart{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,33px);min-height:177px}
.donut{width:128px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none}
.donut div{width:75%;aspect-ratio:1;background:white;border-radius:50%;display:grid;align-content:center;justify-items:center}
.donut strong{font-size:27px;line-height:1.1}
.legend{display:grid;gap:8px;font-size:13px;min-width:0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--color);flex:none}
.legend b{margin-left:auto;padding-left:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(175px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.lane{border:1px solid var(--border);background:#f8f6fc;border-radius:12px;padding:10px;min-height:180px}
.lane.hover{outline:2px solid #9654dc;outline-offset:-2px}
.lane h3{margin-bottom:9px}
.lane-count{font-size:12px;color:var(--muted);margin-left:4px}
.task-card{background:#fff;border:1px solid var(--border);border-radius:9px;padding:9px;margin-bottom:8px;display:grid;gap:6px}
.task-card select{width:100%;font-size:12px}
.today-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)}
.checklist li:last-child{border:0}
.checklist small{display:block}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:7px;overflow-x:auto}
.day-cell{min-height:102px;padding:7px;border:1px solid var(--border);border-radius:9px}
.day-cell.today{border-color:#9953d6;background:#faf5ff}
.day-cell .task-title{font-size:12px;display:block;margin-top:6px}
.day-cell strong{font-size:13px}
.calendar-head{text-align:center;color:var(--muted);font-size:12px}
dialog{width:min(540px,calc(100% - 24px));max-height:calc(100dvh - 24px);border:1px solid var(--border);padding:19px;border-radius:15px;color:inherit;box-shadow:0 20px 80px #20142d44}
dialog::backdrop{background:#21182c76}
.dialog-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.dialog-grid label,.stack{display:grid;gap:5px}
.dialog-grid .wide{grid-column:1/-1}
dialog footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
textarea{resize:vertical;width:100%}
.status-message{position:fixed;bottom:14px;right:14px;max-width:min(440px,calc(100% - 28px));box-shadow:0 4px 18px #0003;background:#292332;color:white;border-radius:9px;padding:9px 13px;z-index:2}
.tools{position:relative}
.tools summary{list-style:none}
.tools summary::-webkit-details-marker{display:none}
.tools-menu{position:absolute;right:0;z-index:1;display:grid;min-width:196px;gap:5px;padding:8px}
.tools-menu button{justify-content:flex-start}
.alert{padding:9px;border:1px solid #e5b1bd;background:#fff0f3;border-radius:8px;margin-bottom:12px;color:#8e2045}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{min-height:89px}.charts{grid-template-columns:1fr 1fr}.status-chart{gap:10px}.donut{width:100px}}
@media(max-width:790px){.shell,.shell.compact{grid-template-columns:59px minmax(0,1fr)}.shell .nav-label,.shell .brand b,.sidebar .toggle{display:none}.sidebar{padding-inline:8px}.sidebar button{justify-content:center;padding-inline:0}.brand{justify-content:center;padding-left:0}.brand .symbol{width:40px;height:40px}.charts,.today-grid{grid-template-columns:1fr}}
@media(max-width:440px){.topbar,main{padding-inline:8px}.metrics{gap:7px}.metric{padding:9px}.metric .icon{display:none}.metric strong{font-size:30px}.panel{padding:10px}.status-chart{flex-wrap:wrap}.dialog-grid{grid-template-columns:1fr}}
</style>
</head>

  <div class="workspace">
    <header class="topbar">
      <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Поиск по поручениям…" aria-label="Поиск по поручениям"></label>
      <details class="tools" id="tools">
        <summary class="button">Данные</summary>
        <div class="panel tools-menu">
          <button class="button" data-action="csv-in">Импорт из Excel (CSV)</button>
          <button class="button" data-action="csv-out">Экспорт в Excel (CSV)</button>
          <button class="button" data-action="backup">Скачать резервную копию</button>
          <button class="button" data-action="restore">Загрузить копию</button>
          <button class="button" data-action="demo">Добавить примеры</button>
        </div>
      </details>
    </header>
    <main>
      <div class="header"><h1 id="heading"></h1><time id="date-label" class="date-label"></time></div>
      <div id="storage-alert" class="alert" role="alert" hidden>Браузер не сохранил данные. Проверьте настройки хранения или скачайте резервную копию перед закрытием приложения.</div>
      <div id="content"></div>
    </main>
  </div>
</div>
<dialog id="task-dialog" aria-labelledby="task-heading">
  <form id="task-form">
    <div class="panel-head"><h2 id="task-heading">Поручение</h2><button class="button" type="button" data-close="task-dialog" aria-label="Закрыть">✕</button></div>
    <div class="dialog-grid">
      <label class="wide">Поручение <input class="field" name="title" required maxlength="220"></label>
      <label>Срок исполнения <input class="field" name="due" type="date"></label>
      <label>Следующий контроль <input class="field" name="check" type="date"></label>
      <label>Основной ответственный <input class="field" name="owner" list="people" maxlength="90"></label>
      <label>Соисполнитель <input class="field" name="helper" list="people" maxlength="90"></label>
      <label>Статус <select class="field" name="status" id="task-status"></select></label>
      <label>Дата начала <input class="field" name="start" type="date"></label>
      <label class="wide">Следующее действие <input class="field" name="next" maxlength="220"></label>
      <label class="wide">Комментарий <textarea class="field" name="note" rows="3" maxlength="4000"></textarea></label>
      <label class="wide"><span><input type="checkbox" name="todayPlan"> В плане на сегодня</span></label>
    </div>
    <footer><span class="muted" id="completed-at"></span><button type="button" id="complete-task" class="button"></button><button class="button primary" type="submit">Сохранить</button></footer>
  </form>
</dialog>
<dialog id="mail-dialog" aria-labelledby="mail-heading">
  <div class="panel-head"><h2 id="mail-heading">Черновик письма</h2><button class="button" data-close="mail-dialog" aria-label="Закрыть">✕</button></div>
  <label class="stack">Ответственный <select id="mail-to" class="field" aria-label="Ответственный"></select></label>
  <p class="hint" id="mail-count"></p>
  <label class="stack">Тема <input id="mail-subject" class="field" value="Поручения и сроки исполнения"></label>
  <label class="stack">Текст <textarea id="mail-body" class="field" rows="9"></textarea></label>
  <footer><button class="button primary" id="copy-mail">Скопировать тему и текст</button></footer>
</dialog>
<datalist id="people"></datalist>
<input id="load-file" type="file" hidden>
<div id="message" class="status-message" role="status" hidden></div>
<script>
"use strict";

const $ = id => document.getElementById(id);
const statuses = {
  new: { label: "Новое", color: "#8c45de" },
  doing: { label: "В работе", color: "#1677d4" },
  waiting: { label: "Жду ответа", color: "#d82988" },
  done: { label: "Выполнено", color: "#238d64" }
};
const views = {
  overview: ["Обзор", "Обзор поручений", "home"],
  today: ["Мой день", "Мой день", "check"],
  tasks: ["Поручения", "Все поручения", "list"],
  board: ["Доска", "Доска поручений", "board"],
  calendar: ["Календарь", "Календарь сроков", "calendar"]
};
const paths = {
  home: "m3 11 9-7 9 7v9H3z",
  list: "M5 5h14v14H5zM8 9h8m-8 4h8m-8 3h4",
  check: "m5 12 4 4 10-10",
  board: "M3 5h18v14H3zM9 5v14m6-14v14",
  calendar: "M4 6h16v14H4zM8 3v6m8-6v6M4 11h16",
  search: "M15 15l5 5m-3-9a6 6 0 1 1-12 0 6 6 0 0 1 12 0Z",
  menu: "M4 5h16v14H4zM9 5v14m6-10-2 3 2 3",
  clock: "M12 7v5l3 2m6-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z",
  warning: "m12 4 9 16H3zM12 10v4m0 3v.1",
  mail: "M3 6h18v12H3zM3 6l9 7 9-7"
};
function icon(name) {
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]}"/></svg>`;
}
function escapeHtml(value = "") {
  const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(value).replace(/[&<>"']/g, character => entities[character]);
}
const key = "day.work-journal.v1";
const sidebarKey = "day.work-journal.compact";
const weekday = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const dateFormat = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "short" });
function dayKey(date = new Date()) {
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
}
function shifted(date, days) {
  const next = new Date(date);
  next.setDate(next.getDate() + days);
  return next;
}
function dateFromKey(value) {
  return new Date(value + "T12:00:00");
}
function shortDate(value) {
  return value ? dateFormat.format(dateFromKey(value)) : "—";
}
function checkedDate(value) {
  const text = String(value ?? "").trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(text) && dayKey(dateFromKey(text)) === text) return text;
  const match = /^(\d{1,2})[./](\d{1,2})[./](\d{4})$/.exec(text);
  if (!match) return "";
  const iso = [match[3], match[2].padStart(2, "0"), match[1].padStart(2, "0")].join("-");
  return dayKey(dateFromKey(iso)) === iso ? iso : "";
}
function clean(value, limit) {
  return String(value ?? "").trim().slice(0, limit);
}
function normalize(row) {
  const today = dayKey();
  const status = Object.hasOwn(statuses, row.status) ? row.status : "new";
  const owner = clean(row.owner, 90);
  const helper = clean(row.helper, 90);
  return {
    id: typeof row.id === "string" && /^[a-zA-Z0-9_-]{1,70}$/.test(row.id) ? row.id : crypto.randomUUID(),
    title: clean(row.title, 220),
    owner,
    helper: owner.toLowerCase() === helper.toLowerCase() ? "" : helper,
    due: checkedDate(row.due),
    check: checkedDate(row.check),
    start: checkedDate(row.start),
    plannedOn: checkedDate(row.plannedOn),
    next: clean(row.next, 220),
    note: clean(row.note, 4000),
    status,
    completed: status === "done" ? checkedDate(row.completed) || today : ""
  };
}

let tasks = [];
let storageCorrupt = false;
try {
  const saved = localStorage.getItem(key);
  if (saved !== null) {
    const parsed = JSON.parse(saved);
    if (!Array.isArray(parsed)) throw new Error("Неверный формат журнала");
    tasks = parsed.map(normalize).filter(task => task.title);
  }
} catch {
  storageCorrupt = true;
  $("storage-alert").hidden = false;
}
let compact = false;
try { compact = localStorage.getItem(sidebarKey) === "1"; } catch {}
let activeView = "overview";
let filter = "all";
let responsible = "";
let selected = new Set();
let calendarMonth = new Date();
let editing = "";
let mailPool = [];
let importKind = "";
let notification;
const draft = { title: "", due: "", people: "" };

function persist(next) {
  tasks = next;
  try {
    if (storageCorrupt) throw new Error("Исходные данные требуют восстановления");
    localStorage.setItem(key, JSON.stringify(tasks));
    $("storage-alert").hidden = true;
  } catch {
    $("storage-alert").hidden = false;
  }
}
function announce(message) {
  clearTimeout(notification);
  $("message").textContent = message;
  $("message").hidden = false;
  notification = setTimeout(() => { $("message").hidden = true; }, 3800);
}
function peopleFor(task) {
  return [task.owner, task.helper].filter(Boolean);
}
function peopleList() {
  return [...new Set(tasks.flatMap(peopleFor))].sort((a, b) => a.localeCompare(b, "ru"));
}
function updateTask(id, changes) {
  persist(tasks.map(task => task.id === id ? normalize({ ...task, ...changes }) : task));
  render();
}
function openTask(id) {
  const task = tasks.find(item => item.id === id);
  if (!task) return;
  editing = id;
  const form = $("task-form");
  for (const field of ["title", "due", "check", "owner", "helper", "status", "start", "next", "note"]) {
    form.elements[field].value = task[field];
  }
  form.elements.todayPlan.checked = task.plannedOn === dayKey();
  $("complete-task").textContent = task.status === "done" ? "Вернуть в работу" : "Отметить выполненным";
  $("completed-at").textContent = task.completed ? "Выполнено " + shortDate(task.completed) : "";
  $("task-dialog").showModal();
}
function finishTask(task) {
  updateTask(task.id, { status: task.status === "done" ? "doing" : "done" });
  announce(task.status === "done" ? "Возвращено в работу" : "Поручение выполнено");
}
function statusOptions(current) {
  return Object.entries(statuses).map(([id, { label }]) =>
    `<option value="${id}"${id === current ? " selected" : ""}>${label}</option>`).join("");
}
function isOverdue(task, today = dayKey()) {
  return task.status !== "done" && task.due && task.due < today;
}
function requiresCheck(task, today = dayKey()) {
  return task.status !== "done" && task.check && task.check <= today;
}
function matchesSearch(task) {
  const query = $("search").value.trim().toLocaleLowerCase("ru");
  return !query || [task.title, task.owner, task.helper, task.next, task.note].some(value =>
    value.toLocaleLowerCase("ru").includes(query));
}
function visibleTasks() {
  const today = dayKey();
  return tasks.filter(task => matchesSearch(task)
    && (!responsible || peopleFor(task).includes(responsible))
    && (filter === "all" || task.status === filter
      || (filter === "due" && task.status !== "done" && task.due === today)
      || (filter === "late" && isOverdue(task, today))
      || (filter === "check" && requiresCheck(task, today))));
}
function taskButton(task) {
  return `<button class="task-title" data-task="${task.id}">${escapeHtml(task.title)}</button>`;
}
function dueLabel(task) {
  return `<time class="${isOverdue(task) ? "late" : ""}">${shortDate(task.due)}</time>`;
}
function button(action, label, style = "", glyph = "") {
  return `<button type="button" data-action="${action}" class="button ${style}">${glyph ? icon(glyph) : ""}${label}</button>`;
}
function metric(label, value, color, symbol, target) {
  return `<button class="metric ${color}" data-filter="${target}"><span>${label}</span><strong>${value}</strong>${icon(symbol)}</button>`;
}
function weeklyChart(rows, now) {
  const labels = Array.from({ length: 7 }, (_, index) => shifted(now, index));
  const counts = labels.map(date => rows.filter(task => task.due === dayKey(date) && task.status !== "done").length);
  const maximum = Math.max(4, ...counts);
  const points = counts.map((count, index) => [48 + index * 69, 130 - count / maximum * 102]);
  const line = points.map(([x, y]) => x + "," + y).join(" ");
  const ticks = labels.map((date, index) => {
    const [x, y] = points[index];
    return `<circle cx="${x}" cy="${y}" r="4" fill="#a12ec1" stroke="#fff" stroke-width="2"><title>${shortDate(dayKey(date))}: ${counts[index]}</title></circle>
      <text x="${x}" y="${y - 9}" text-anchor="middle">${counts[index]}</text><text x="${x}" y="153" text-anchor="middle">${weekday[(date.getDay() + 6) % 7]}</text>`;
  }).join("");
  return `<div class="panel"><div class="panel-head"><h2>Сроки на 7 дней</h2></div><div class="chart-wrap">
    <svg viewBox="0 0 512 160" role="img" aria-label="Сроки открытых поручений за семь дней: ${counts.join(", ")}">
      <defs><linearGradient id="line-color"><stop stop-color="#6932cf"/><stop offset=".55" stop-color="#d9258d"/><stop offset="1" stop-color="#df731e"/></linearGradient>
      <linearGradient id="area-color" x2="0" y2="1"><stop stop-color="#d54cbd" stop-opacity=".42"/><stop offset="1" stop-color="#ab6ded" stop-opacity=".06"/></linearGradient></defs>
      <path d="M35 28h446M35 62h446M35 96h446M35 130h446" fill="none" stroke="#eae3f0"/>
      <polygon points="48,130 ${line} 462,130" fill="url(#area-color)"/>
      <polyline points="${line}" fill="none" stroke="url(#line-color)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      ${ticks}</svg></div></div>`;
}
function statusChart(rows) {
  let angle = 0;
  const segments = [];
  const legend = Object.entries(statuses).map(([id, item]) => {
    const count = rows.filter(task => task.status === id).length;
    if (count) {
      const end = angle + count / rows.length * 360;
      segments.push(`${item.color} ${angle}deg ${end}deg`);
      angle = end;
    }
    return `<span><i style="--color:${item.color}"></i>${item.label}<b>${count}</b></span>`;
  }).join("");
  const paint = segments.length ? "conic-gradient(" + segments.join(",") + ")" : "#eee9f4";
  return `<div class="panel"><div class="panel-head"><h2>По статусам</h2></div><div class="status-chart">
    <div class="donut" style="background:${paint}"><div><strong>${rows.length}</strong><small>всего</small></div></div>
    <div class="legend">${legend}</div></div></div>`;
}
function overview() {
  const rows = tasks.filter(matchesSearch);
  const today = dayKey();
  return `<div class="metrics">
    ${metric("В работе", rows.filter(task => task.status === "doing").length, "violet", "list", "doing")}
    ${metric("Срок сегодня", rows.filter(task => task.due === today && task.status !== "done").length, "blue", "calendar", "due")}
    ${metric("Пора проверить", rows.filter(task => requiresCheck(task, today)).length, "pink", "clock", "check")}
    ${metric("Просрочено", rows.filter(task => isOverdue(task, today)).length, "orange", "warning", "late")}
    </div><div class="charts">${weeklyChart(rows, new Date())}${statusChart(rows)}</div>${table(rows)}`;
}
function table(rows) {
  const body = rows.map(task => `<tr>
    <td><input type="checkbox" data-select="${task.id}" aria-label="Выбрать: ${escapeHtml(task.title)}"${selected.has(task.id) ? " checked" : ""}></td>
    <td>${taskButton(task)} ${task.plannedOn === dayKey() && task.status !== "done" ? '<small>· сегодня</small>' : ""}</td>
    <td>${dueLabel(task)}</td><td>${escapeHtml(peopleFor(task).join(", ") || "—")}</td>
    <td><select class="badge ${task.status}" data-status="${task.id}" aria-label="Статус: ${escapeHtml(task.title)}">${statusOptions(task.status)}</select></td>
    <td><button type="button" data-complete="${task.id}" class="button" title="${task.status === "done" ? "Вернуть в работу" : "Отметить выполненным"}" aria-label="${task.status === "done" ? "Вернуть в работу" : "Отметить выполненным"}: ${escapeHtml(task.title)}">${task.status === "done" ? "↶" : icon("check")}</button></td></tr>`).join("");
  return `<section class="panel"><div class="panel-head"><h2>Поручения <small>${rows.length}</small></h2>
    ${button("mail", "Подготовить письмо", "primary", "mail")}</div>
    <form id="quick-form"></form>
    <div class="table-wrap"><table class="tasks">
    <thead><tr><th scope="col"></th><th scope="col">Поручение</th><th scope="col">Срок</th><th scope="col">Ответственные</th><th scope="col">Статус</th><th scope="col"></th></tr></thead>
    <tbody><tr class="add-row"><td></td>
    <td><input id="quick-title" form="quick-form" class="field" name="title" aria-label="Новое поручение" placeholder="Новое поручение…" value="${escapeHtml(draft.title)}" required maxlength="220"></td>
    <td><input form="quick-form" class="field" name="due" type="date" value="${escapeHtml(draft.due)}" aria-label="Срок нового поручения"></td>
    <td colspan="2"><input form="quick-form" class="field" name="people" list="people" value="${escapeHtml(draft.people)}" maxlength="183" placeholder="Иванов, Петрова" aria-label="Ответственные через запятую"></td>
    <td><button class="button primary" form="quick-form" type="submit" title="Сохранить строку" aria-label="Сохранить строку">${icon("check")}</button></td></tr>
    ${body || '<tr><td colspan="6" class="empty">В этом списке пока нет поручений</td></tr>'}</tbody></table></div>
    <p class="hint">Tab — следующее поле · Enter — сохранить строку</p></section>`;
}
function filteredTable() {
  const filters = { all: "Все статусы", ...Object.fromEntries(Object.entries(statuses).map(([id, item]) => [id, item.label])),
    due: "Срок сегодня", late: "Просрочено", check: "Пора проверить" };
  const people = peopleList().map(name => `<option${name === responsible ? " selected" : ""}>${escapeHtml(name)}</option>`);
  return `<div class="toolbar">
    <select id="filter" class="field" aria-label="Фильтр поручений">${Object.entries(filters).map(([value, label]) =>
      `<option value="${value}"${filter === value ? " selected" : ""}>${label}</option>`).join("")}</select>
    <select id="responsible" class="field" aria-label="Фильтр по ответственному"><option value="">Все ответственные</option>${people.join("")}</select>
    </div>${table(visibleTasks())}`;
}
function board() {
  const rows = tasks.filter(matchesSearch);
  return `<div class="toolbar">${button("new-row", "Добавить в таблице", "primary")}</div><div class="board">${Object.entries(statuses).map(([id, { label }]) => {
    const lane = rows.filter(task => task.status === id);
    return `<section class="lane" data-lane="${id}"><h3>${label}<span class="lane-count">${lane.length}</span></h3>
      ${lane.map(task => `<article class="task-card" draggable="true" data-drag="${task.id}">${taskButton(task)}
        <small>Срок: ${dueLabel(task)}</small>${task.check && id === "waiting" ? "<small>Контроль: " + shortDate(task.check) + "</small>" : ""}
        <small>${escapeHtml(peopleFor(task).join(", ") || "Без ответственного")}</small>
        <select data-status="${task.id}" class="field" aria-label="Статус: ${escapeHtml(task.title)}">${statusOptions(id)}</select></article>`).join("")}</section>`;
  }).join("")}</div>`;
}
function todayView() {
  const today = dayKey();
  const rows = tasks.filter(matchesSearch);
  const panels = [
    ["План на сегодня", rows.filter(task => task.plannedOn === today), "Отметьте нужные дела в карточках поручений."],
    ["Пора запросить статус", rows.filter(task => requiresCheck(task, today)), "На сегодня контроль не запланирован."],
    ["Просрочено", rows.filter(task => isOverdue(task, today)), "Просроченных поручений нет."],
    ["Срок сегодня", rows.filter(task => task.due === today && task.status !== "done"), "Сегодня сроков нет."]
  ];
  return `<div class="today-grid">${panels.map(([label, items, empty]) =>
    `<section class="panel"><div class="panel-head"><h2>${label}</h2>${label === "Пора запросить статус" && items.length ? button("mail-check", "Подготовить письмо", "", "mail") : ""}</div>
    <ul class="checklist">${items.map(task => `<li><input type="checkbox" data-finish="${task.id}" aria-label="Выполнено: ${escapeHtml(task.title)}"${task.status === "done" ? " checked" : ""}>
    <div>${taskButton(task)}<small>${escapeHtml(task.next || peopleFor(task).join(", "))}${task.due ? " · " + shortDate(task.due) : ""}</small></div></li>`).join("") || '<li class="muted">' + empty + '</li>'}</ul></section>`).join("")}</div>`;
}
function calendar() {
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const first = new Date(year, month, 1);
  const offset = (first.getDay() + 6) % 7;
  const length = new Date(year, month + 1, 0).getDate();
  const rows = tasks.filter(matchesSearch);
  const label = new Intl.DateTimeFormat("ru-RU", { month: "long", year: "numeric" }).format(first);
  return `<div class="panel"><div class="panel-head"><h2>${label.charAt(0).toUpperCase() + label.slice(1)}</h2><div class="actions">
    ${button("month-prev", "← Месяц")}${button("month-now", "Сегодня")}${button("month-next", "Месяц →")}</div></div>
    <div class="calendar">${weekday.map(day => `<div class="calendar-head">${day}</div>`).join("")}
    ${"<div></div>".repeat(offset)}${Array.from({ length }, (_, index) => {
      const date = dayKey(new Date(year, month, index + 1));
      return `<section class="day-cell ${date === dayKey() ? "today" : ""}"><strong>${index + 1}</strong>
        ${rows.filter(task => task.due === date || task.check === date || task.start === date).map(task =>
          taskButton(task) + "<small>" + [task.due === date && "Срок", task.check === date && "Контроль", task.start === date && "Начало"].filter(Boolean).join(" · ") + "</small>").join("")}</section>`;
    }).join("")}</div></div>`;
}
const renderers = { overview, today: todayView, tasks: filteredTable, board, calendar };
function render() {
  $("heading").textContent = views[activeView][1];
  const now = new Date();
  $("date-label").dateTime = dayKey(now);
  $("date-label").textContent = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long" }).format(now);
  $("people").innerHTML = peopleList().map(name => `<option value="${escapeHtml(name)}"></option>`).join("");
  for (const nav of $("navigation").children) {
    if (nav.dataset.view === activeView) nav.setAttribute("aria-current", "page");
    else nav.removeAttribute("aria-current");
  }
  $("content").innerHTML = renderers[activeView]();
}
function go(view) {
  activeView = view;
  render();
}
function applySidebar() {
  $("shell").classList.toggle("compact", compact);
  $("toggle").setAttribute("aria-expanded", String(!compact));
  const text = compact ? "Развернуть меню" : "Свернуть меню";
  $("toggle").setAttribute("aria-label", text);
  $("toggle").title = text;
}

function buildMail() {
  const recipient = $("mail-to").value;
  const rows = mailPool.filter(task => !recipient || peopleFor(task).includes(recipient));
  $("mail-count").textContent = "Поручений в письме: " + rows.length;
  const lines = rows.map((task, index) => {
    const assignees = peopleFor(task).join(", ");
    return `${index + 1}. ${task.title} — ${task.due ? dateFromKey(task.due).toLocaleDateString("ru-RU") : "срок уточняется"}${assignees ? " (" + assignees + ")" : ""}.`;
  });
  $("mail-body").value = rows.length ? ["Добрый день!", "", "Прошу сообщить статус по следующим поручениям.", "", ...lines, "", "Спасибо."].join("\n") : "";
}
function openMail(checksOnly) {
  const source = activeView === "tasks" ? visibleTasks() : tasks.filter(matchesSearch);
  const checked = source.filter(task => selected.has(task.id));
  mailPool = (checksOnly ? source.filter(task => requiresCheck(task)) : checked.length ? checked : source)
    .filter(task => task.status !== "done")
    .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
  if (!mailPool.length) return announce("Для письма нужны открытые поручения.");
  const recipients = [...new Set(mailPool.flatMap(peopleFor))].sort((a, b) => a.localeCompare(b, "ru"));
  $("mail-to").innerHTML = '<option value="">Все выбранные поручения</option>' + recipients.map(name => `<option>${escapeHtml(name)}</option>`).join("");
  $("mail-subject").value = "Поручения и сроки исполнения";
  buildMail();
  $("mail-dialog").showModal();
}
async function copyMail() {
  const text = $("mail-subject").value + "\n\n" + $("mail-body").value;
  try {
    await navigator.clipboard.writeText(text);
    announce("Тема и текст скопированы");
  } catch {
    const field = $("mail-body");
    field.focus();
    field.select();
    announce("Буфер обмена недоступен. Текст выделен для ручного копирования.");
  }
}

const csvFields = [
  ["title", "Поручение", ["Задание", "Задача", "Название"]],
  ["due", "Срок", ["Срок исполнения", "Контрольный срок"]],
  ["owner", "Ответственный", ["Основной ответственный", "Ответственные"]],
  ["helper", "Соисполнитель", ["Второй ответственный"]],
  ["status", "Статус", []],
  ["check", "Следующий контроль", ["Дата контроля"]],
  ["start", "Дата начала", []],
  ["next", "Следующее действие", []],
  ["note", "Комментарий", ["Примечание"]],
  ["completed", "Дата выполнения", []],
  ["plannedOn", "Дата в плане", []]
];
function download(name, content, type) {
  const href = URL.createObjectURL(new Blob([content], { type }));
  const link = Object.assign(document.createElement("a"), { href, download: name });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(href), 1000);
}
function exportCsv() {
  const protect = value => {
    const text = String(value ?? "");
    const safe = /^\s*[=+\-@\t\r\n]/.test(text) ? "'" + text : text;
    return '"' + safe.replaceAll('"', '""') + '"';
  };
  const rows = [csvFields.map(([, name]) => name), ...tasks.map(task =>
    csvFields.map(([field]) => field === "status" ? statuses[task.status].label : task[field]))];
  download("day-" + dayKey() + ".csv", "\uFEFF" + rows.map(row => row.map(protect).join(";")).join("\r\n"), "text/csv;charset=utf-8");
}
function parseDelimited(text) {
  const input = text.replace(/^\uFEFF/, "");
  const header = input.split(/\r?\n/, 1)[0].replace(/"(?:""|[^"])*"/g, "");
  const separator = header.includes(";") ? ";" : header.includes("\t") ? "\t" : ",";
  const rows = [];
  let row = [];
  let value = "";
  let quoted = false;
  for (let index = 0; index < input.length; index += 1) {
    const character = input[index];
    if (quoted) {
      if (character === '"' && input[index + 1] === '"') {
        value += '"';
        index += 1;
      } else if (character === '"') {
        quoted = false;
      } else {
        value += character;
      }
    } else if (character === '"' && value === "") {
      quoted = true;
    } else if (character === separator) {
      row.push(value);
      value = "";
    } else if (character === "\n" || character === "\r") {
      if (character === "\r" && input[index + 1] === "\n") index += 1;
      rows.push([...row, value]);
      row = [];
      value = "";
    } else {
      value += character;
    }
  }
  if (quoted) throw new Error("В CSV обнаружена незакрытая кавычка.");
  return [...rows, [...row, value]].filter(items => items.some(cell => cell.trim()));
}
function importCsv(text) {
  const [header, ...records] = parseDelimited(text);
  const headerNames = (header || []).map(value => value.trim().toLowerCase());
  const indexes = csvFields.map(([field, name, aliases]) => [field,
    headerNames.findIndex(column => [name, ...aliases].some(label => label.toLowerCase() === column))]);
  if (indexes[0][1] < 0) throw new Error("В первой строке CSV нужен столбец «Поручение», «Задание», «Задача» или «Название».");
  const imported = [];
  const errors = [];
  records.forEach((values, index) => {
    const row = Object.fromEntries(indexes.map(([field, position]) => [field, values[position]?.trim() || ""]));
    if (!row.title) return;
    for (const dateField of ["due", "check", "start", "completed", "plannedOn"]) {
      if (row[dateField] && !checkedDate(row[dateField])) errors.push(index + 2);
    }
    const rawStatus = row.status.toLowerCase();
    row.status = Object.entries(statuses).find(([id, item]) => id === rawStatus || item.label.toLowerCase() === rawStatus)?.[0]
      || (row.completed ? "done" : "new");
    if (!row.helper && /[,;]/.test(row.owner)) {
      [row.owner, row.helper] = row.owner.split(/[,;]/).map(value => value.trim());
    }
    imported.push(normalize(row));
  });
  if (errors.length) throw new Error("Проверьте формат дат в строках CSV: " + [...new Set(errors)].slice(0, 6).join(", ") + ".");
  if (!imported.length) throw new Error("В CSV нет поручений для импорта.");
  return imported;
}
function mergeImported(imported, identify) {
  const known = new Set(tasks.map(identify));
  const additions = imported.filter(task => {
    const id = identify(task);
    if (known.has(id)) return false;
    known.add(id);
    return true;
  });
  if (additions.length) persist([...tasks, ...additions]);
  render();
  announce("Добавлено: " + additions.length + ". Пропущено совпадений: " + (imported.length - additions.length) + ".");
}
async function handleFile(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) throw new Error("Размер файла превышает 5 МБ.");
  if (importKind === "csv") {
    const bytes = await file.arrayBuffer();
    let text;
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
    catch { text = new TextDecoder("windows-1251").decode(bytes); }
    mergeImported(importCsv(text), task => [task.title, task.due, task.owner, task.helper].map(value => value.toLowerCase()).join("\u0000"));
    return;
  }
  const data = JSON.parse(await file.text());
  if (data?.version !== 1 || !Array.isArray(data.tasks) || data.tasks.some(task => !task || typeof task.title !== "string")) {
    throw new Error("Выберите JSON-копию, созданную приложением «День».");
  }
  const imported = data.tasks.map(normalize).filter(task => task.title);
  if (storageCorrupt && window.confirm("Заменить нечитаемое содержимое журнала этой резервной копией?")) {
    storageCorrupt = false;
  }
  mergeImported(imported, task => task.id);
  if (!storageCorrupt && !imported.length) persist(tasks);
}
function addDemo() {
  const now = new Date();
  const examples = [
    ["Сведения по поверке", 3, "Иванов", "Петрова", "waiting", 0, "Уточнить, кто прислал данные"],
    ["График выездов", 0, "Соколов", "", "doing", 0, "Согласовать выезд на участок"],
    ["Реестр средств измерений", -1, "Иванов", "", "done", null, ""],
    ["Перечни приборов по участкам", 0, "Петрова", "", "doing", null, "Запросить перечни приборов"],
    ["Документы на контрольные приборы", -2, "Соколов", "", "doing", null, "Уточнить комплект документов"],
    ["План проверки документов", 2, "Иванов", "Соколов", "new", null, ""],
    ["Сводка по участкам", 3, "Петрова", "", "new", 2, ""],
    ["Заключение по результатам поверки", 5, "Иванов", "", "waiting", 3, ""]
  ];
  const rows = examples.map(([title, due, owner, helper, status, check, next], index) => normalize({
    id: "example-" + index, title, due: dayKey(shifted(now, due)), owner, helper, status, next,
    check: check === null ? "" : dayKey(shifted(now, check)), plannedOn: [1, 2, 3].includes(index) ? dayKey(now) : ""
  }));
  mergeImported(rows, task => task.id);
}
const actions = {
  mail: () => openMail(false),
  "mail-check": () => openMail(true),
  "new-row": () => { filter = "all"; responsible = ""; go("tasks"); $("quick-title").focus(); },
  "month-prev": () => changeMonth(-1),
  "month-now": () => { calendarMonth = new Date(); render(); },
  "month-next": () => changeMonth(1),
  "csv-in": () => chooseFile("csv"),
  "csv-out": exportCsv,
  backup: () => download("day-" + dayKey() + ".json", JSON.stringify({ version: 1, tasks }, null, 2), "application/json"),
  restore: () => chooseFile("json"),
  demo: addDemo
};
function changeMonth(offset) {
  calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + offset, 1);
  render();
}
function chooseFile(kind) {
  importKind = kind;
  const input = $("load-file");
  input.accept = kind === "csv" ? ".csv,.tsv,text/csv" : ".json,application/json";
  input.value = "";
  input.click();
}
$("navigation").innerHTML = Object.entries(views).map(([view, [label, , glyph]]) =>
  `<button type="button" data-view="${view}" aria-label="${label}" title="${label}">${icon(glyph)}<span class="nav-label">${label}</span></button>`).join("");
document.querySelectorAll("[data-icon]").forEach(element => { element.innerHTML = icon(element.dataset.icon); });
$("toggle").addEventListener("click", () => {
  compact = !compact;
  try { localStorage.setItem(sidebarKey, compact ? "1" : "0"); } catch {}
  applySidebar();
});
$("search").addEventListener("input", () => {
  if (activeView === "overview" && $("search").value) go("tasks");
  else render();
});
$("task-status").innerHTML = statusOptions("new");
$("task-form").addEventListener("submit", event => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(event.target));
  if (!fields.title.trim()) {
    event.target.elements.title.focus();
    return announce("Введите название поручения.");
  }
  fields.plannedOn = fields.todayPlan ? dayKey() : "";
  updateTask(editing, fields);
  $("task-dialog").close();
  announce("Изменения сохранены");
});
$("complete-task").addEventListener("click", () => {
  const task = tasks.find(item => item.id === editing);
  if (!task) return;
  $("task-dialog").close();
  finishTask(task);
});
$("mail-to").addEventListener("change", buildMail);
$("copy-mail").addEventListener("click", copyMail);
$("load-file").addEventListener("change", async event => {
  try {
    await handleFile(event.target.files[0]);
  } catch (error) {
    announce(error instanceof SyntaxError ? "Файл содержит неверный JSON." : error.message);
  }
});
document.addEventListener("submit", event => {
  if (event.target.id !== "quick-form") return;
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(event.target));
  const names = fields.people.split(/[;,]/).map(name => name.trim()).filter(Boolean);
  if (!fields.title.trim() || names.length > 2 || names.some(name => name.length > 90)) {
    announce(names.length > 2 || names.some(name => name.length > 90) ? "Укажите до двух ответственных через запятую, до 90 символов на имя." : "Введите название поручения.");
    return;
  }
  const [owner = "", helper = ""] = names;
  persist([normalize({ title: fields.title, due: fields.due, owner, helper }), ...tasks]);
  Object.assign(draft, { title: "", due: "", people: "" });
  if (activeView === "tasks") {
    filter = "all";
    responsible = "";
    $("search").value = "";
  }
  render();
  $("quick-title").focus();
  announce("Поручение добавлено");
});
document.addEventListener("input", event => {
  const field = event.target;
  if (field.form?.id === "quick-form" && Object.hasOwn(draft, field.name)) draft[field.name] = field.value;
});
document.addEventListener("click", event => {
  const control = event.target.closest("button");
  if (!control) return;
  const { view, task, complete, close, filter: newFilter, action } = control.dataset;
  if (view) return go(view);
  if (task) return openTask(task);
  if (complete) return finishTask(tasks.find(item => item.id === complete));
  if (close) return $(close).close();
  if (newFilter) {
    filter = newFilter;
    responsible = "";
    return go("tasks");
  }
  if (action && Object.hasOwn(actions, action)) {
    $("tools").open = false;
    actions[action]();
  }
});
document.addEventListener("change", event => {
  const field = event.target;
  const { status, select, finish } = field.dataset;
  if (status) return updateTask(status, { status: field.value });
  if (finish) return finishTask(tasks.find(item => item.id === finish));
  if (select) {
    if (field.checked) selected.add(select);
    else selected.delete(select);
  }
  if (field.id === "filter") { filter = field.value; render(); $("filter").focus(); }
  if (field.id === "responsible") { responsible = field.value; render(); $("responsible").focus(); }
});
$("content").addEventListener("dragstart", event => {
  const card = event.target.closest("[data-drag]");
  if (!card) return;
  event.dataTransfer.setData("text/plain", card.dataset.drag);
  event.dataTransfer.effectAllowed = "move";
});
$("content").addEventListener("dragover", event => {
  const lane = event.target.closest("[data-lane]");
  if (!lane || !event.dataTransfer.types.includes("text/plain")) return;
  event.preventDefault();
  lane.classList.add("hover");
});
$("content").addEventListener("dragleave", event => {
  const lane = event.target.closest("[data-lane]");
  if (lane && !lane.contains(event.relatedTarget)) lane.classList.remove("hover");
});
$("content").addEventListener("drop", event => {
  const lane = event.target.closest("[data-lane]");
  if (!lane) return;
  event.preventDefault();
  lane.classList.remove("hover");
  const id = event.dataTransfer.getData("text/plain");
  if (tasks.some(task => task.id === id)) updateTask(id, { status: lane.dataset.lane });
});
window.addEventListener("storage", event => {
  if (event.key !== key || storageCorrupt || !$("storage-alert").hidden) return;
  try {
    const data = JSON.parse(event.newValue || "[]");
    tasks = data.map(normalize).filter(task => task.title);
    render();
  } catch {
    storageCorrupt = true;
    $("storage-alert").hidden = false;
  }
});
applySidebar();
render();
</script>
